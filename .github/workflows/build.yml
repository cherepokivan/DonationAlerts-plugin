name: Build DonationAlerts Fabric
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build Fabric mod
        run: |
          chmod +x gradlew
          ./gradlew clean build
      - name: Verify Fabric mod contents
        run: |
          jar tf build/libs/DonationAlerts-Fabric-1.0.0.jar | grep -Fx 'fabric.mod.json'
          jar tf build/libs/DonationAlerts-Fabric-1.0.0.jar | grep -Fx 'config.yml'
      - name: Upload Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: DonationAlerts-Fabric
          path: build/libs/DonationAlerts-Fabric-1.0.0.jar
          if-no-files-found: error
